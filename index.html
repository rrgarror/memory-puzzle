<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#100d0b">
    <title>Memory Puzzle</title>
    <link rel="stylesheet" href="styles.css?v=20261003-1">
    <script src="script.js?v=20261003-1" defer></script>
  </head>

  <body>
    <main class="page-shell">
      <section
        class="puzzle-stage is-loading is-empty is-folded"
        id="puzzleStage"
        aria-label="Interactive memory puzzle"
      >
        <div class="stage-light stage-light--one" aria-hidden="true"></div>
        <div class="stage-light stage-light--two" aria-hidden="true"></div>

        <button
          class="advance-control"
          id="advanceControl"
          type="button"
          aria-label="Unfold the puzzle mat"
          aria-describedby="puzzleStatus"
          disabled
        ></button>

        <button class="restart-button" id="restartButton" type="button" aria-label="Restart puzzle">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5.2 8.2A8 8 0 1 1 4.5 15M5.2 8.2V3.8M5.2 8.2h4.4"></path>
          </svg>
        </button>

        <div class="tap-indicator" id="tapIndicator" aria-hidden="true">
          <span></span>
        </div>

        <div class="mat-scene" id="matScene" aria-hidden="true">
          <div class="mat-shadow" id="matShadow"></div>
          <div class="puzzle-mat" id="puzzleMat">
            <span class="mat-panel mat-panel--left" id="matPanelLeft"></span>
            <span class="mat-panel mat-panel--center"></span>
            <span class="mat-panel mat-panel--right" id="matPanelRight"></span>
            <span class="mat-stitching"></span>
            <span class="mat-crease mat-crease--left"></span>
            <span class="mat-crease mat-crease--right"></span>
          </div>
          <div class="mat-strap" id="matStrap"><span></span></div>
        </div>

        <div class="piece-area" id="pieceArea" aria-hidden="true"></div>

        <div class="memory-morph" id="memoryMorph" aria-hidden="true" hidden>
          <div class="memory-morph__veil"></div>
          <div class="morph-shell" id="morphShell">
            <svg viewBox="0 0 400 400" preserveAspectRatio="none">
              <defs>
                <clipPath id="morph-clip"><path id="morphPath"></path></clipPath>
              </defs>
              <image
                id="morphFullImage"
                x="0"
                y="0"
                width="400"
                height="400"
                preserveAspectRatio="xMidYMid meet"
                clip-path="url(#morph-clip)"
              ></image>
              <image
                id="morphCropImage"
                x="0"
                y="0"
                width="400"
                height="400"
                preserveAspectRatio="xMidYMid slice"
                clip-path="url(#morph-clip)"
              ></image>
              <path class="morph-edge" id="morphEdge"></path>
            </svg>
          </div>
        </div>

        <div class="assembly-board" id="assemblyBoard" aria-hidden="true" hidden></div>
        <div class="final-board" id="finalBoard" aria-label="Completed photo puzzle" hidden></div>

        <div class="snap-flash" id="snapFlash" aria-hidden="true"></div>
        <p class="sr-only" id="puzzleStatus" aria-live="polite">Loading memories</p>
      </section>
    </main>
  </body>
</html>
